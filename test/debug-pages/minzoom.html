<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Minzoom debug</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <link rel="stylesheet" href="../../dist/maplibre-gl.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
      }
      html,
      body,
      #map {
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div id="map"></div>

    <script src="../../dist/maplibre-gl-dev.js"></script>
    <script>
      var map = (window.map = new maplibregl.Map({
        container: "map",
        zoom: 12.5,
        center: [-77.01866, 38.888],
        style: {
          version: 8,
          glyphs: "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
          sources: {
            data: {
              type: "geojson",
              data: {
                type: "FeatureCollection",
                features: [
                  {
                    type: "Feature",
                    geometry: {
                      type: "Point",
                      coordinates: [0, 0],
                    },
                    properties: {
                      minzoom: 1.5,
                    },
                  },
                  {
                    type: "Feature",
                    geometry: {
                      type: "Point",
                      coordinates: [0, -2],
                    },
                    properties: {
                      minzoom: 1.75,
                    },
                  },
                ],
              },
            },
          },
          layers: [
            {
              id: "labels",
              type: "symbol",
              layout: {
                "text-field": ["get", "minzoom"],
                "text-font": ["Open Sans Semibold"],
                "text-offset": [0, 1.2],
                "text-size": 13,
                "text-allow-overlap": true,
                "text-ignore-placement": true,
              },
              paint: {
                "text-color": "black",
              },
              source: "data",
            },
          ],
        },
        hash: true,
      }));
    </script>
  </body>
</html>
