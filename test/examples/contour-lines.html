<!DOCTYPE html>
<html lang="en">
<head>
    <title>Add Contour Lines</title>
    <meta property="og:description" content="Add contour lines to your map from a raster-dem source." />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='../../dist/maplibre-gl.css' />
    <script src='../../dist/maplibre-gl-dev.js'></script>
    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
    </style>
</head>
<body>
<div id="map"></div>
<script>
    const map = (window.map = new maplibregl.Map({
        container: 'map',
        zoom: 13,
        center: [11.3229, 47.2738],
        hash: true,
        style: {
            version: 8,
            glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
            sources: {
                dem: {
                    type: 'raster-dem',
                    tiles: ['https://demotiles.maplibre.org/terrain-tiles/{z}/{x}/{y}.png'],
                    tileSize: 512,
                    maxzoom: 12
                },
                contours: {
                    type: 'contour',
                    source: 'dem',
                    unit: 'feet',
                    intervals: ['step', ['zoom'], 200, 12, 100, 14, 50, 15, 20],
                    majorMultiplier: ['step', ['zoom'], 5, 14, 4, 15, 5],
                }
            },
            layers: [
                {
                    id: 'hills',
                    type: 'hillshade',
                    source: 'dem',
                    layout: {visibility: 'visible'},
                    paint: {'hillshade-exaggeration': 0.25}
                },
                {
                    id: 'contours',
                    type: 'line',
                    source: 'contours',
                    paint: {
                        'line-opacity': 0.5,
                        'line-width': ['case', ['get', 'major'], 1, 0.5]
                    }
                },
                {
                    id: 'contour-text',
                    type: 'symbol',
                    source: 'contours',
                    filter: ['get', 'major'],
                    paint: {
                        'text-halo-color': 'white',
                        'text-halo-width': 1
                    },
                    layout: {
                        'symbol-placement': 'line',
                        'text-size': 10,
                        'text-field': [
                            'concat',
                            ['number-format', ['get', 'ele'], {}],
                            '\''
                        ],
                        'text-font': ['Noto Sans Bold']
                    }
                }
            ]
        }
    }));
</script>
</body>
</html>
